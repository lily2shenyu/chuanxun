plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chuanxun.chat'
    compileSdk 34

    signingConfigs {
        love {
            storeFile file('../keystore/chuanxun.keystore')
            storePassword 'chuanxun'
            keyAlias 'chuanxun'
            keyPassword 'chuanxun'
        }
    }

    defaultConfig {
        applicationId "com.chuanxun.chat"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.love
        }
        release {
            signingConfig signingConfigs.love
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
